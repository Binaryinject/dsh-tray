name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: dsh-tray-setup-win-x64.exe
          - os: macos-14
            rid: osx-arm64
            artifact: dsh-tray-osx-arm64.dmg
          - os: macos-13
            rid: osx-x64
            artifact: dsh-tray-osx-x64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install macOS workload
        if: runner.os == 'macOS'
        run: dotnet workload install macos

      - name: Publish
        run: dotnet publish -c Release -r ${{ matrix.rid }}

      - name: Build NSIS installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $candidates = @("C:\Program Files (x86)\NSIS\makensis.exe", "C:\Program Files\NSIS\makensis.exe")
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { Write-Error "makensis not found"; exit 1 }
          # NSIS resolves File/OutFile relative to the script's directory
          Copy-Item bin/Release/net9.0-windows/win-x64/publish/dsh-tray.exe .
          & $makensis installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dsh-tray-setup.exe "$env:GITHUB_WORKSPACE/${{ matrix.artifact }}"

      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/package-macos.sh ${{ matrix.rid }} 0.1.0

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
