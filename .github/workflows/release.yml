name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: dsh-tray-win-x64.exe
          - os: macos-14
            rid: osx-arm64
            asset: dsh-tray-osx-arm64
          - os: macos-13
            rid: osx-x64
            asset: dsh-tray-osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install macOS workload
        if: runner.os == 'macOS'
        run: dotnet workload install macos

      - name: Publish
        run: dotnet publish -c Release -r ${{ matrix.rid }}

      - name: Collect artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv bin/Release/net9.0-windows/win-x64/publish/dsh-tray.exe ${{ matrix.asset }}

      - name: Collect artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: mv bin/Release/net9.0-macos/${{ matrix.rid }}/publish/dsh-tray ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
